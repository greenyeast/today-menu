<style data-weeai-img>
img[data-img-query]:not([src]){visibility:hidden}

<script data-edit-script="true" data-weeai-img>
(function(){
  if (window.__weeaiImg) return; window.__weeaiImg = 1;
  var MAP = {};
  var BRIDGE = false;
  var asked = {};
  function seed(q){ return String(q || 'fallback').toLowerCase().replace(/[^a-z0-9가-힣]+/g, '-').slice(0, 32) || 'fallback'; }
  function fallback(q, w, h){ return 'https://picsum.photos/seed/' + encodeURIComponent(seed(q)) + '/' + w + '/' + h; }
  function box(img){
    // 배치 크기(offset)를 먼저 — 모션 무대는 화면에 맞추려고 통째로 줄여 그려서 화면상 크기(rect)는 실제의 절반쯤이다
    var r = img.getBoundingClientRect();
    var w = img.offsetWidth || Math.round(r.width) || 600, h = img.offsetHeight || Math.round(r.height) || Math.round(w * 2 / 3);
    return { w: Math.min(Math.max(w * 2, 400), 2000), h: Math.min(Math.max(h * 2, 300), 2000) };
  }
  var BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
  // 검색 응답을 기다리는 동안: 투명 임시 이미지 + 반짝임(깨진 아이콘·대체 문구가 보이지 않게)
  function hold(img){
    if (img.getAttribute('data-img-pending')) return;
    img.setAttribute('data-img-pending', '1');
    if (!img.getAttribute('src')) img.setAttribute('src', BLANK);
  }
  // 진짜 사진이 다 받아지면 반짝임을 끄고 살짝 나타나게 한다
  function settle(img){
    img.removeAttribute('data-img-pending');
    img.setAttribute('data-img-fadein', '1');
  }
  function apply(img, hit){
    if (!hit || !hit.url) return;
    hold(img);
    img.addEventListener('load', function onLoad(){ if (img.getAttribute('src') === BLANK) return; img.removeEventListener('load', onLoad); settle(img); });
    img.setAttribute('src', hit.url);
    img.setAttribute('data-img-resolved', '1');
    if (hit.author && !img.getAttribute('title')) img.setAttribute('title', 'Photo: ' + hit.author + (hit.provider ? ' / ' + hit.provider : ''));
    if (hit.link) img.setAttribute('data-img-credit', hit.link);
  }
  function scan(){
    var imgs = document.querySelectorAll('img[data-img-query]:not([data-img-resolved])');
    var ask = [];
    for (var i = 0; i < imgs.length; i++) {
      var img = imgs[i];
      var q = (img.getAttribute('data-img-query') || '').trim();
      if (!q) continue;
      if (MAP[q]) { apply(img, MAP[q]); continue; }
      hold(img);
      var b = box(img);
      if (!BRIDGE) { apply(img, { url: fallback(q, b.w, b.h) }); continue; }
      if (!asked[q]) { asked[q] = 1; ask.push({ q: q, w: b.w, h: b.h }); }
    }
    if (ask.length) parent.postMessage({ type: 'weeai-img-query', items: ask }, '*');
  }
  var timer = null;
  function later(){ if (timer) return; timer = setTimeout(function(){ timer = null; scan(); }, 60); }
  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d || d.type !== 'weeai-img-result' || !d.map) return;
    for (var k in d.map) MAP[k] = d.map[k];
    scan();
  });
  document.addEventListener('error', function(e){
    var el = e.target;
    if (!el || el.tagName !== 'IMG' || el.getAttribute('data-img-fallback')) return;
    el.setAttribute('data-img-fallback', '1');
    el.removeAttribute('data-img-pending');
    var b = box(el);
    el.setAttribute('src', fallback(el.getAttribute('data-img-query') || el.getAttribute('alt') || el.getAttribute('src'), b.w, b.h));
  }, true);
  function start(){
    scan();
    new MutationObserver(later).observe(document.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ['data-img-query'] });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>

  <script type="text/babel" data-type="module" data-presets="react">
    // Lucide 아이콘 컴포넌트 헬퍼
    const createLucideIcon = (iconName) => {
      return ({ className = '', size = 24, strokeWidth = 2, ...props }) => {
        const ref = React.useRef(null);
        React.useEffect(() => {
          if (ref.current && typeof lucide !== 'undefined' && lucide[iconName]) {
            ref.current.innerHTML = '';
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            const iconNode = lucide.createElement(lucide[iconName]);
            svg.innerHTML = iconNode.innerHTML;
            Array.from(iconNode.attributes).forEach(attr => {
              svg.setAttribute(attr.name, attr.value);
            });
            if (className) svg.setAttribute('class', className);
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
            svg.setAttribute('stroke-width', strokeWidth);
            ref.current.appendChild(svg);
          }
        }, [className, size, strokeWidth]);
        return React.createElement('span', {
          ref,
          style: { display: 'inline-flex', alignItems: 'center', justifyContent: 'center' },
          ...props
        });
      };
    };
    const Grid = createLucideIcon('Grid');
    const Info = createLucideIcon('Info');
    const Plus = createLucideIcon('Plus');
    const Edit = createLucideIcon('Edit');
    const Trash2 = createLucideIcon('Trash2');
    const RefreshCw = createLucideIcon('RefreshCw');
    const AlertCircle = createLucideIcon('AlertCircle');
    const CheckCircle = createLucideIcon('CheckCircle');
    const Database = createLucideIcon('Database');
    const Calendar = createLucideIcon('Calendar');
    const X = createLucideIcon('X');
    const List = createLucideIcon('List');

    

    const { useState, useEffect, useRef } = React;
    const STORAGE_KEY = 'school-meals-demo-v1';
    const numberFormatter = new Intl.NumberFormat('ko-KR');

    const mealTypes = [
      { value: 'breakfast', label: '조식' },
      { value: 'lunch', label: '중식' },
      { value: 'dinner', label: '석식' }
    ];

    const inputClass =
      'block min-h-[48px] w-full min-w-0 rounded-xl border border-line bg-white px-3 py-3 text-base text-ink';

    const secondaryButton =
      'inline-flex min-h-[44px] items-center justify-center gap-2 rounded-xl border border-line bg-white px-4 text-sm font-medium hover:bg-surface';

    function localDate(date = new Date()) {
      return [
        String(date.getFullYear()).padStart(4, '0'),
        String(date.getMonth() + 1).padStart(2, '0'),
        String(date.getDate()).padStart(2, '0')
      ].join('-');
    }

    function parseDate(value) {
      if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) {
        return null;
      }
      const [year, month, day] = value.split('-').map(Number);
      if (year < 1) return null;
      const date = new Date(2000, month - 1, day, 12);
      date.setFullYear(year);
      return localDate(date) === value ? date : null;
    }

    function shiftDate(value, amount) {
      const date = parseDate(value);
      if (!date) return localDate();
      date.setDate(date.getDate() + amount);
      return localDate(date);
    }

    function mealLabel(value) {
      return mealTypes.find(type => type.value === value)?.label || '';
    }

    function formatPrice(value) {
      return value === 0 ? '무료' : `${numberFormatter.format(value)}원`;
    }

    function formatDate(value) {
      const date = parseDate(value);
      return date
        ? new Intl.DateTimeFormat('ko-KR', {
            year: 'numeric', month: 'long', day: 'numeric'
          }).format(date)
        : value;
    }

    function createSamples() {
      const today = localDate();
      const now = new Date().toISOString();
      const examples = [
        [today, 'breakfast', '소고기 야채죽',
          ['메추리알 장조림', '오이무침', '배추김치'], 3500,
          '쇠고기, 달걀, 대두, 밀 함유'],
        [today, 'lunch', '제육볶음 한 상',
          ['잡곡밥', '미역국', '콩나물무침', '배추김치'], 5500,
          '돼지고기, 대두, 밀 함유'],
        [today, 'dinner', '닭갈비 덮밥',
          ['팽이버섯 된장국', '양배추 샐러드', '깍두기'], 5000,
          '닭고기, 대두, 밀 함유'],
        [shiftDate(today, 1), 'lunch', '돈가스 정식',
          ['쌀밥', '유부 장국', '양배추 샐러드', '단무지'], 5800,
          '돼지고기, 달걀, 우유, 밀, 대두 함유']
      ];

      return examples.map(([date, mealType, title, items, price, allergyInfo], index) => ({
        id: `sample-${date}-${mealType}-${index}`,
        date, mealType, title, items, price, allergyInfo,
        createdAt: now,
        updatedAt: now
      }));
    }

    function isValidData(value) {
      if (!Array.isArray(value)) return false;
      const ids = new Set();
      const slots = new Set();

      return value.every(meal => {
        if (!meal || typeof meal !== 'object') return false;
        const slot = `${meal.date}-${meal.mealType}`;
        const valid =
          typeof meal.id === 'string' && meal.id.trim().length > 0 &&
          !!parseDate(meal.date) &&
          mealTypes.some(type => type.value === meal.mealType) &&
          typeof meal.title === 'string' &&
          meal.title.trim().length >= 1 &&
          meal.title.trim().length <= 100 &&
          Array.isArray(meal.items) && meal.items.length > 0 &&
          meal.items.every(item => typeof item === 'string' && item.trim()) &&
          Number.isSafeInteger(meal.price) && meal.price >= 0 &&
          (meal.allergyInfo === undefined || typeof meal.allergyInfo === 'string') &&
          typeof meal.createdAt === 'string' &&
          Number.isFinite(Date.parse(meal.createdAt)) &&
          typeof meal.updatedAt === 'string' &&
          Number.isFinite(Date.parse(meal.updatedAt)) &&
          !ids.has(meal.id) && !slots.has(slot);

        ids.add(meal.id);
        slots.add(slot);
        return valid;
      });
    }

    function readMeals(initialize = false) {
      let raw;

      try {
        raw = localStorage.getItem(STORAGE_KEY);
      } catch {
        return {
          meals: [],
          blocked: true,
          warning: '브라우저 저장소에 접근할 수 없습니다. 사이트 데이터 저장 설정을 확인한 뒤 새로고침해 주세요.'
        };
      }

      if (raw === null) {
        if (!initialize) return { meals: [], blocked: false, warning: '' };
        const samples = createSamples();

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(samples));
          return { meals: samples, blocked: false, warning: '' };
        } catch {
          return {
            meals: samples,
            blocked: false,
            warning: '브라우저 저장에 실패했습니다. 현재 샘플은 임시로 표시되며, 새로고침 후 유지되지 않을 수 있습니다.'
          };
        }
      }

      try {
        const meals = JSON.parse(raw);
        if (!isValidData(meals)) throw new Error('invalid-data');
        return { meals, blocked: false, warning: '' };
      } catch {
        return {
          meals: [],
          blocked: true,
          warning: '저장된 식단 데이터를 읽을 수 없습니다. 원본은 변경하지 않았습니다. 필요한 경우 브라우저 개발자 도구에서 원본을 복사한 뒤 데모 데이터 초기화를 진행해 주세요. 초기화 전에는 등록·수정·삭제가 제한됩니다.'
        };
      }
    }

    function Header() {
      return (
        <header className="sticky top-0 z-50 border-b border-line bg-white">
          <div className="border-b border-line bg-surface">
            <div className="mx-auto flex max-w-[1200px] items-start justify-center gap-2 px-5 py-2.5 text-center text-xs text-body">
              <Info className="mt-0.5 h-3.5 w-3.5 shrink-0" aria-hidden="true" />
              <p>체험용 서비스입니다. 데이터는 현재 브라우저에만 저장됩니다.</p>
            </div>
          </div>

          <div className="mx-auto flex max-w-[1200px] flex-col gap-4 px-5 py-4 sm:flex-row sm:items-center sm:justify-between lg:px-8">
            <a
              href="./index.html"
              aria-label="오늘의 학식 메인 페이지로 이동"
              className="flex min-w-0 items-center gap-3 self-start rounded-xl hover:opacity-80"
            >
              <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-[13px] bg-brand text-white">
                <Grid className="h-5 w-5" aria-hidden="true" />
              </div>
              <div>
                <p className="text-lg font-bold tracking-tight text-ink">오늘의 학식</p>
                <p className="text-xs text-muted">학교 식당 메뉴 안내</p>
              </div>
            </a>

            <nav
              aria-label="주요 메뉴"
              className="grid w-full grid-cols-2 gap-1 rounded-[14px] bg-surface p-1 sm:w-auto sm:min-w-[240px]"
            >
              <a
                href="./student.html"
                className="flex min-h-[44px] items-center justify-center rounded-[10px] px-5 py-2 text-sm font-medium text-body hover:bg-white hover:text-brand"
              >
                학생 보기
              </a>
              <a
                href="./menumanage.html"
                aria-current="page"
                className="flex min-h-[44px] items-center justify-center rounded-[10px] bg-white px-5 py-2 text-sm font-semibold text-brand shadow-soft hover:bg-blue-50"
              >
                메뉴 관리
              </a>
            </nav>
          </div>
        </header>
      );
    }

    function Field({ name, label, required, error, children, hint }) {
      return (
        <div className="min-w-0">
          <label htmlFor={name} className="mb-2 block text-sm font-semibold text-ink">
            {label}
            {required && <span className="ml-1 text-brand" aria-hidden="true">*</span>}
            {!required && <span className="ml-2 font-normal text-muted">선택</span>}
          </label>
          {children}
          {hint && <p id={`${name}-hint`} className="mt-2 text-xs text-muted">{hint}</p>}
          {error && (
            <p id={`${name}-error`} role="alert" className="mt-2 text-sm text-red-700">
              {error}
            </p>
          )}
        </div>
      );
    }

    function MealForm({ editingMeal, defaultDate, meals, onSave, onCancel, blocked }) {
      const [form, setForm] = useState(() => ({
        date: editingMeal?.date || defaultDate,
        mealType: editingMeal?.mealType || 'breakfast',
        title: editingMeal?.title || '',
        items: editingMeal?.items.join('\n') || '',
        price: editingMeal ? String(editingMeal.price) : '',
        allergyInfo: editingMeal?.allergyInfo || ''
      }));
      const [errors, setErrors] = useState({});
      const formRef = useRef(null);

      useEffect(() => {
        const frame = requestAnimationFrame(() => {
          formRef.current?.scrollIntoView({ block: 'start', behavior: 'auto' });
          formRef.current?.querySelector('input')?.focus({ preventScroll: true });
        });
        return () => cancelAnimationFrame(frame);
      }, []);

      function update(event) {
        const { name, value } = event.target;
        setForm(previous => ({ ...previous, [name]: value }));
        setErrors(previous => ({ ...previous, [name]: undefined }));
      }

      function fieldProps(name) {
        return {
          id: name,
          name,
          value: form[name],
          onChange: update,
          'aria-invalid': !!errors[name],
          'aria-describedby': [
            name === 'items' ? 'items-hint' : '',
            name === 'price' ? 'price-hint' : '',
            errors[name] ? `${name}-error` : ''
          ].filter(Boolean).join(' ') || undefined,
          className: `${inputClass} ${errors[name] ? 'border-red-500' : ''}`
        };
      }

      function submit(event) {
        event.preventDefault();
        const nextErrors = {};
        const title = form.title.trim();
        const items = form.items.split(/\r?\n/).map(item => item.trim()).filter(Boolean);
        const priceText = form.price.trim();
        const price = Number(priceText);

        if (!parseDate(form.date)) nextErrors.date = '유효한 제공 날짜를 선택해 주세요.';
        if (!mealTypes.some(type => type.value === form.mealType)) {
          nextErrors.mealType = '식사 구분을 선택해 주세요.';
        }
        if (!title || title.length > 100) {
          nextErrors.title = '대표 메뉴명은 공백을 제외하고 1~100자로 입력해 주세요.';
        }
        if (items.length === 0) nextErrors.items = '메뉴 구성을 한 항목 이상 입력해 주세요.';
        if (!priceText || !/^\d+$/.test(priceText) || !Number.isSafeInteger(price) || price < 0) {
          nextErrors.price = '가격은 빈칸 없이 0 이상의 정수로 입력해 주세요.';
        }
        if (meals.some(meal =>
          meal.date === form.date &&
          meal.mealType === form.mealType &&
          meal.id !== editingMeal?.id
        )) {
          nextErrors.mealType = '해당 날짜와 식사 구분의 식단이 이미 등록되어 있습니다.';
        }

        setErrors(nextErrors);
        if (Object.keys(nextErrors).length) {
          requestAnimationFrame(() => {
            formRef.current?.querySelector('[aria-invalid="true"]')?.focus();
          });
          return;
        }

        onSave({
          date: form.date,
          mealType: form.mealType,
          title,
          items,
          price,
          allergyInfo: form.allergyInfo.trim()
        }, editingMeal);
      }

      return (
        <section
          id="meal-form"
          ref={formRef}
          aria-labelledby="form-title"
          className="mb-8 rounded-[24px] border border-line bg-surface p-5 md:p-7"
        >
          <div className="mb-6 flex items-start justify-between gap-3">
            <div>
              <h2 id="form-title" className="text-xl font-bold tracking-tight text-ink">
                {editingMeal ? '식단 수정' : '식단 등록'}
              </h2>
              <p className="mt-2 text-sm text-muted">
                별표(*) 항목은 필수입니다. 같은 날짜의 같은 식사는 한 건만 등록할 수 있습니다.
              </p>
            </div>
            <button
              type="button"
              onClick={onCancel}
              aria-label="식단 입력 취소"
              className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl hover:bg-white"
            >
              <X className="h-5 w-5" aria-hidden="true" />
            </button>
          </div>

          <form noValidate onSubmit={submit}>
            <div className="grid gap-5 md:grid-cols-2">
              <Field name="date" label="제공 날짜" required error={errors.date}>
                <input {...fieldProps('date')} type="date" required min="0001-01-01" max="9999-12-31" />
              </Field>

              <Field name="mealType" label="식사 구분" required error={errors.mealType}>
                <select {...fieldProps('mealType')} required>
                  {mealTypes.map(type => (
                    <option key={type.value} value={type.value}>{type.label}</option>
                  ))}
                </select>
              </Field>

              <div className="md:col-span-2">
                <Field name="title" label="대표 메뉴명" required error={errors.title}>
                  <input {...fieldProps('title')} type="text" required placeholder="예: 제육볶음 한 상" />
                </Field>
              </div>

              <Field
                name="items"
                label="메뉴 구성"
                required
                error={errors.items}
                hint="한 줄에 한 항목씩 입력해 주세요. 빈 줄은 저장하지 않습니다."
              >
                <textarea
                  {...fieldProps('items')}
                  rows="5"
                  required
                  placeholder={'잡곡밥\n미역국\n콩나물무침\n배추김치'}
                />
              </Field>

              <div className="space-y-5">
                <Field
                  name="price"
                  label="가격"
                  required
                  error={errors.price}
                  hint="원 단위로 입력해 주세요. 0원은 무료로 표시됩니다."
                >
                  <input {...fieldProps('price')} type="number" min="0" step="1" required placeholder="5500" />
                </Field>

                <Field name="allergyInfo" label="알레르기 안내">
                  <textarea
                    {...fieldProps('allergyInfo')}
                    rows="2"
                    placeholder="예: 돼지고기, 대두, 밀 함유"
                  />
                </Field>
              </div>
            </div>

            {blocked && (
              <p role="alert" className="mt-5 text-sm text-red-700">
                저장 데이터를 확인할 수 없어 저장이 제한됩니다. 입력 내용을 별도로 보관한 뒤 저장소 안내를 확인해 주세요.
              </p>
            )}

            <div className="mt-7 flex flex-wrap justify-end gap-2 border-t border-line pt-5">
              <button type="button" onClick={onCancel} className={secondaryButton}>취소</button>
              <button
                type="submit"
                disabled={blocked}
                className="inline-flex min-h-[44px] items-center justify-center rounded-xl bg-brand px-6 text-sm font-semibold text-white hover:bg-[#0062C5]"
              >
                {editingMeal ? '저장' : '등록'}
              </button>
            </div>
          </form>
        </section>
      );
    }

    function App() {
      const [data, setData] = useState(() => readMeals(true));
      const [dateFilter, setDateFilter] = useState('');
      const [typeFilter, setTypeFilter] = useState('all');
      const [formState, setFormState] = useState(null);
      const [message, setMessage] = useState(null);
      const registerRef = useRef(null);
      const noticeRef = useRef(null);

      useEffect(() => {
        const refresh = () => setData(readMeals());
        const onStorage = event => {
          if (event.key === STORAGE_KEY || event.key === null) refresh();
        };
        const onVisibility = () => {
          if (document.visibilityState === 'visible') refresh();
        };

        window.addEventListener('storage', onStorage);
        window.addEventListener('focus', refresh);
        window.addEventListener('pageshow', refresh);
        document.addEventListener('visibilitychange', onVisibility);
        return () => {
          window.removeEventListener('storage', onStorage);
          window.removeEventListener('focus', refresh);
          window.removeEventListener('pageshow', refresh);
          document.removeEventListener('visibilitychange', onVisibility);
        };
      }, []);

      function notify(text, error = false) {
        setMessage({ text, error });
        if (error) {
          requestAnimationFrame(() => noticeRef.current?.focus());
        }
      }

      // 상태 변경 전 저장을 시도합니다. 실패하면 기존 상태와 입력을 유지합니다.
      function persist(meals, successText) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(meals));
          setData({ meals, blocked: false, warning: '' });
          notify(successText);
          return true;
        } catch {
          notify(
            '브라우저 저장에 실패했습니다. 변경 내용은 적용되지 않았으며 입력 내용은 유지됩니다. 사이트 데이터 저장 설정과 저장 공간을 확인해 주세요.',
            true
          );
          return false;
        }
      }

      function resetFilters() {
        setDateFilter('');
        setTypeFilter('all');
      }

      function cancelForm() {
        setFormState(null);
        requestAnimationFrame(() => registerRef.current?.focus());
      }

      function openForm(meal = null) {
        setMessage(null);
        setFormState({
          key: `${meal?.id || 'new'}-${Date.now()}`,
          meal,
          defaultDate: dateFilter || localDate()
        });
      }

      function saveMeal(values, original) {
        // 저장 직전 최신 데이터를 읽어 다른 페이지의 변경을 덮어쓰지 않습니다.
        const latest = readMeals();
        if (latest.blocked) {
          setData(latest);
          notify(latest.warning, true);
          return;
        }

        if (original && !latest.meals.some(meal => meal.id === original.id)) {
          setData(latest);
          notify('수정 중인 식단이 다른 화면에서 삭제되었습니다. 입력 내용을 확인한 뒤 새 식단으로 등록해 주세요.', true);
          return;
        }

        if (latest.meals.some(meal =>
          meal.date === values.date &&
          meal.mealType === values.mealType &&
          meal.id !== original?.id
        )) {
          setData(latest);
          notify('해당 날짜와 식사 구분에 다른 식단이 등록되었습니다. 날짜 또는 식사 구분을 변경해 주세요.', true);
          return;
        }

        const now = new Date().toISOString();
        const meal = {
          ...values,
          id: original?.id || (
            window.crypto?.randomUUID
              ? window.crypto.randomUUID()
              : `meal-${Date.now()}-${Math.random().toString(36).slice(2)}`
          ),
          createdAt: original?.createdAt || now,
          updatedAt: now
        };

        const next = original
          ? latest.meals.map(item => item.id === original.id ? meal : item)
          : [...latest.meals, meal];

        if (persist(next, original ? '식단이 수정되었습니다.' : '식단이 등록되었습니다.')) {
          setDateFilter(meal.date);
          setTypeFilter('all');
          setFormState(null);
          requestAnimationFrame(() => registerRef.current?.focus());
        }
      }

      function deleteMeal(meal) {
        const accepted = window.confirm(
          `${formatDate(meal.date)} ${mealLabel(meal.mealType)}\n‘${meal.title}’ 식단을 삭제할까요?`
        );
        if (!accepted) return;

        const latest = readMeals();
        if (latest.blocked) {
          setData(latest);
          notify(latest.warning, true);
          return;
        }

        if (persist(
          latest.meals.filter(item => item.id !== meal.id),
          '식단이 삭제되었습니다.'
        )) {
          if (formState?.meal?.id === meal.id) setFormState(null);
          requestAnimationFrame(() => registerRef.current?.focus());
        }
      }

      function resetDemo() {
        if (!window.confirm('현재 데이터를 지우고 샘플 식단으로 되돌릴까요?')) return;
        if (persist(createSamples(), '오늘 기준 샘플 식단으로 초기화되었습니다.')) {
          resetFilters();
          setFormState(null);
        }
      }

      const filtered = data.meals
        .filter(meal => !dateFilter || meal.date === dateFilter)
        .filter(meal => typeFilter === 'all' || meal.mealType === typeFilter)
        .sort((a, b) =>
          a.date.localeCompare(b.date) ||
          mealTypes.findIndex(type => type.value === a.mealType) -
          mealTypes.findIndex(type => type.value === b.mealType)
        );

      return (
        <div>
          <a
            href="#main-content"
            className="sr-only z-[60] rounded-xl bg-white px-5 py-3 text-brand shadow-soft focus:not-sr-only focus:fixed focus:left-4 focus:top-4"
          >
            본문으로 바로가기
          </a>

          <Header />

          <main id="main-content" className="mx-auto w-full max-w-[1200px] px-5 lg:px-8">
            <section className="flex flex-col justify-between gap-5 pb-8 pt-10 sm:flex-row sm:items-end md:pt-14">
              <div>
                <p className="mb-3 text-sm font-semibold text-brand">매일의 식단을 간편하게</p>
                <h1 className="text-3xl font-bold tracking-tight text-ink md:text-4xl">
                  메뉴 관리
                </h1>
                <p className="mt-3 text-sm text-muted md:text-base">
                  학교 식당의 조식·중식·석식을 등록하고 수정하세요.
                </p>
              </div>

              <button
                ref={registerRef}
                type="button"
                disabled={data.blocked}
                onClick={() => openForm()}
                className="inline-flex min-h-[48px] shrink-0 items-center justify-center gap-2 rounded-xl bg-brand px-5 text-sm font-semibold text-white hover:bg-[#0062C5]"
              >
                <Plus className="h-4 w-4" aria-hidden="true" />
                식단 등록
              </button>
            </section>

            {data.warning && (
              <div role="alert" className="mb-6 flex items-start gap-3 rounded-2xl border border-amber-200 bg-amber-50 p-5 text-sm text-amber-900">
                <AlertCircle className="mt-0.5 h-5 w-5 shrink-0" aria-hidden="true" />
                <p>{data.warning}</p>
              </div>
            )}

            <div aria-live="polite">
              {message && (
                <div
                  ref={noticeRef}
                  tabIndex="-1"
                  role={message.error ? 'alert' : 'status'}
                  className={`mb-6 flex items-start gap-3 rounded-2xl border p-5 text-sm ${
                    message.error
                      ? 'border-red-200 bg-red-50 text-red-800'
                      : 'border-green-200 bg-green-50 text-green-800'
                  }`}
                >
                  {message.error
                    ? <AlertCircle className="mt-0.5 h-5 w-5 shrink-0" aria-hidden="true" />
                    : <CheckCircle className="mt-0.5 h-5 w-5 shrink-0" aria-hidden="true" />}
                  <p className="flex-1">{message.text}</p>
                  <button
                    type="button"
                    onClick={() => setMessage(null)}
                    aria-label="안내 닫기"
                    className="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg hover:bg-white"
                  >
                    <X className="h-4 w-4" aria-hidden="true" />
                  </button>
                </div>
              )}
            </div>

            {formState && (
              <MealForm
                key={formState.key}
                editingMeal={formState.meal}
                defaultDate={formState.defaultDate}
                meals={data.meals}
                blocked={data.blocked}
                onSave={saveMeal}
                onCancel={cancelForm}
              />
            )}

            <section aria-labelledby="filter-title" className="rounded-[24px] bg-surface p-5 md:p-6">
              <h2 id="filter-title" className="mb-4 text-sm font-semibold text-ink">식단 필터</h2>
              <div className="grid items-end gap-4 sm:grid-cols-2 md:grid-cols-[1fr_1fr_auto]">
                <div className="min-w-0">
                  <label htmlFor="filter-date" className="mb-2 block text-sm font-medium">
                    제공 날짜
                  </label>
                  <input
                    id="filter-date"
                    type="date"
                    min="0001-01-01"
                    max="9999-12-31"
                    value={dateFilter}
                    onChange={event => setDateFilter(event.target.value)}
                    aria-describedby="filter-date-hint"
                    className={inputClass}
                  />
                  <p id="filter-date-hint" className="mt-2 text-xs text-muted">
                    날짜를 비우면 전체 기간을 표시합니다.
                  </p>
                </div>

                <div className="min-w-0">
                  <label htmlFor="filter-type" className="mb-2 block text-sm font-medium">
                    식사 구분
                  </label>
                  <select
                    id="filter-type"
                    value={typeFilter}
                    onChange={event => setTypeFilter(event.target.value)}
                    className={inputClass}
                  >
                    <option value="all">전체</option>
                    {mealTypes.map(type => (
                      <option key={type.value} value={type.value}>{type.label}</option>
                    ))}
                  </select>
                  <p className="mt-2 text-xs text-muted">조식·중식·석식을 구분해 조회합니다.</p>
                </div>

                <button type="button" onClick={resetFilters} className={`${secondaryButton} md:mb-6`}>
                  <RefreshCw className="h-4 w-4" aria-hidden="true" />
                  필터 초기화
                </button>
              </div>
            </section>

            <section aria-labelledby="list-title" className="py-8 md:py-10">
              <div className="mb-5 flex flex-wrap items-center justify-between gap-3">
                <h2 id="list-title" className="text-lg font-bold tracking-tight text-ink">
                  등록된 식단
                </h2>
                <span aria-live="polite" className="text-xs text-muted">
                  전체 {numberFormatter.format(data.meals.length)}건 · 조회 {numberFormatter.format(filtered.length)}건
                </span>
              </div>

              {filtered.length === 0 ? (
                <div className="rounded-[24px] border border-line bg-white px-6 py-12 text-center">
                  <List className="mx-auto mb-4 h-7 w-7 text-muted" aria-hidden="true" />
                  <h3 className="font-semibold text-ink">
                    {data.blocked
                      ? '저장 데이터를 확인해 주세요.'
                      : data.meals.length === 0
                        ? '아직 등록된 식단이 없습니다.'
                        : '필터에 맞는 식단이 없습니다.'}
                  </h3>
                  <p className="mt-2 text-sm text-muted">
                    {data.blocked
                      ? '위 안내를 확인하거나 아래에서 데모 데이터를 초기화할 수 있습니다.'
                      : data.meals.length === 0
                        ? '식단 등록 버튼을 눌러 첫 식단을 추가해 보세요.'
                        : '날짜와 식사 구분을 변경하거나 필터를 초기화해 주세요.'}
                  </p>
                  {!data.blocked && data.meals.length > 0 && (
                    <button
                      type="button"
                      onClick={resetFilters}
                      className="mt-4 rounded-lg px-3 py-2 text-sm font-semibold text-brand hover:bg-surface"
                    >
                      전체 식단 보기
                    </button>
                  )}
                </div>
              ) : (
                <div className="overflow-hidden rounded-[24px] border border-line bg-white shadow-soft">
                  <div className="hidden grid-cols-[1.2fr_.6fr_2fr_.8fr_1fr] gap-4 border-b border-line bg-surface px-6 py-4 text-xs font-semibold text-muted md:grid">
                    <span>날짜</span>
                    <span>식사 구분</span>
                    <span>대표 메뉴명</span>
                    <span className="text-right">가격</span>
                    <span className="text-right">수정 · 삭제</span>
                  </div>

                  <ul className="divide-y divide-line">
                    {filtered.map(meal => (
                      <li
                        key={meal.id}
                        className="grid min-w-0 gap-4 p-5 md:grid-cols-[1.2fr_.6fr_2fr_.8fr_1fr] md:items-center md:px-6 md:py-5"
                      >
                        <div className="flex items-center gap-2 text-sm">
                          <Calendar className="h-4 w-4 shrink-0 text-muted md:hidden" aria-hidden="true" />
                          <time dateTime={meal.date}>{formatDate(meal.date)}</time>
                        </div>

                        <div>
                          <span className="inline-flex rounded-lg bg-surface px-2.5 py-1 text-xs font-medium text-body">
                            {mealLabel(meal.mealType)}
                          </span>
                        </div>

                        <p className="min-w-0 text-base font-semibold text-ink md:text-sm">
                          {meal.title}
                        </p>

                        <p className="text-sm font-semibold tabular-nums text-ink md:text-right">
                          {formatPrice(meal.price)}
                        </p>

                        <div className="flex items-center gap-2 border-t border-line pt-3 md:justify-end md:border-0 md:pt-0">
                          <button
                            type="button"
                            disabled={data.blocked}
                            onClick={() => openForm(meal)}
                            aria-label={`${meal.date} ${mealLabel(meal.mealType)} ${meal.title} 수정`}
                            className="inline-flex min-h-[40px] items-center justify-center gap-1.5 rounded-lg px-2.5 text-sm text-brand hover:bg-blue-50"
                          >
                            <Edit className="h-4 w-4" aria-hidden="true" />
                            <span className="md:sr-only">수정</span>
                          </button>
                          <button
                            type="button"
                            disabled={data.blocked}
                            onClick={() => deleteMeal(meal)}
                            aria-label={`${meal.date} ${mealLabel(meal.mealType)} ${meal.title} 삭제`}
                            className="inline-flex min-h-[40px] items-center justify-center gap-1.5 rounded-lg px-2.5 text-sm text-red-700 hover:bg-red-50"
                          >
                            <Trash2 className="h-4 w-4" aria-hidden="true" />
                            <span className="md:sr-only">삭제</span>
                          </button>
                        </div>
                      </li>
                    ))}
                  </ul>
                </div>
              )}

              <p className="mt-4 text-xs leading-relaxed text-muted">
                날짜 오름차순으로 표시하며, 같은 날짜는 조식·중식·석식 순서로 정렬합니다.
              </p>
            </section>

            <aside
              aria-labelledby="storage-title"
              className="mb-12 rounded-2xl bg-surface p-5 md:p-6"
            >
              <div className="flex items-start gap-3">
                <Database className="mt-0.5 h-5 w-5 shrink-0 text-muted" aria-hidden="true" />
                <div className="min-w-0">
                  <h2 id="storage-title" className="text-sm font-semibold text-ink">
                    데이터는 이 브라우저에만 저장됩니다.
                  </h2>
                  <p className="mt-2 text-sm leading-relaxed text-muted">
                    같은 주소에서 이용하는 학생 보기와 메뉴 관리는 저장된 식단을 함께 사용합니다.
                    다른 브라우저나 기기와는 공유되지 않습니다. 메뉴 관리는 관리자 인증이나
                    접근 제한이 없는 체험용 화면입니다.
                  </p>
                  <p className="mt-2 text-xs leading-relaxed text-muted">
                    샘플 식단과 알레르기 정보는 데모 예시입니다.
                    초기화하면 현재 데이터를 삭제하고 오늘 기준 샘플 식단으로 교체합니다.
                  </p>
                  <button type="button" onClick={resetDemo} className={`${secondaryButton} mt-4`}>
                    <RefreshCw className="h-4 w-4" aria-hidden="true" />
                    데모 데이터 초기화
                  </button>
                </div>
              </div>
            </aside>
          </main>

          <footer className="border-t border-line">
            <div className="mx-auto flex max-w-[1200px] flex-col justify-between gap-4 px-5 py-6 sm:flex-row sm:items-center lg:px-8">
              <div>
                <a
                  href="./index.html"
                  className="rounded text-sm font-semibold text-ink hover:text-brand"
                >
                  오늘의 학식
                </a>
                <p className="mt-1 text-xs text-muted">
                  하루 세 끼, 학교 식당 메뉴를 한눈에.
                </p>
              </div>
              <p className="text-xs text-muted">
                샘플 식단과 알레르기 정보는 데모 예시입니다.
              </p>
            </div>
          </footer>
        </div>
      );
    }

    window.ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
