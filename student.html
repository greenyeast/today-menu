@keyframes weeai-img-shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}

<script data-edit-script="true" data-weeai-img>
(function(){
  if (window.__weeaiImg) return; window.__weeaiImg = 1;
  var MAP = {};
  var BRIDGE = false;
  var asked = {};
  function seed(q){ return String(q || 'fallback').toLowerCase().replace(/[^a-z0-9가-힣]+/g, '-').slice(0, 32) || 'fallback'; }
  function fallback(q, w, h){ return 'https://picsum.photos/seed/' + encodeURIComponent(seed(q)) + '/' + w + '/' + h; }
  function box(img){
    // 배치 크기(offset)를 먼저 — 모션 무대는 화면에 맞추려고 통째로 줄여 그려서 화면상 크기(rect)는 실제의 절반쯤이다
    var r = img.getBoundingClientRect();
    var w = img.offsetWidth || Math.round(r.width) || 600, h = img.offsetHeight || Math.round(r.height) || Math.round(w * 2 / 3);
    return { w: Math.min(Math.max(w * 2, 400), 2000), h: Math.min(Math.max(h * 2, 300), 2000) };
  }
  var BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
  // 검색 응답을 기다리는 동안: 투명 임시 이미지 + 반짝임(깨진 아이콘·대체 문구가 보이지 않게)
  function hold(img){
    if (img.getAttribute('data-img-pending')) return;
    img.setAttribute('data-img-pending', '1');
    if (!img.getAttribute('src')) img.setAttribute('src', BLANK);
  }
  // 진짜 사진이 다 받아지면 반짝임을 끄고 살짝 나타나게 한다
  function settle(img){
    img.removeAttribute('data-img-pending');
    img.setAttribute('data-img-fadein', '1');
  }
  function apply(img, hit){
    if (!hit || !hit.url) return;
    hold(img);
    img.addEventListener('load', function onLoad(){ if (img.getAttribute('src') === BLANK) return; img.removeEventListener('load', onLoad); settle(img); });
    img.setAttribute('src', hit.url);
    img.setAttribute('data-img-resolved', '1');
    if (hit.author && !img.getAttribute('title')) img.setAttribute('title', 'Photo: ' + hit.author + (hit.provider ? ' / ' + hit.provider : ''));
    if (hit.link) img.setAttribute('data-img-credit', hit.link);
  }
  function scan(){
    var imgs = document.querySelectorAll('img[data-img-query]:not([data-img-resolved])');
    var ask = [];
    for (var i = 0; i < imgs.length; i++) {
      var img = imgs[i];
      var q = (img.getAttribute('data-img-query') || '').trim();
      if (!q) continue;
      if (MAP[q]) { apply(img, MAP[q]); continue; }
      hold(img);
      var b = box(img);
      if (!BRIDGE) { apply(img, { url: fallback(q, b.w, b.h) }); continue; }
      if (!asked[q]) { asked[q] = 1; ask.push({ q: q, w: b.w, h: b.h }); }
    }
    if (ask.length) parent.postMessage({ type: 'weeai-img-query', items: ask }, '*');
  }
  var timer = null;
  function later(){ if (timer) return; timer = setTimeout(function(){ timer = null; scan(); }, 60); }
  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d || d.type !== 'weeai-img-result' || !d.map) return;
    for (var k in d.map) MAP[k] = d.map[k];
    scan();
  });
  document.addEventListener('error', function(e){
    var el = e.target;
    if (!el || el.tagName !== 'IMG' || el.getAttribute('data-img-fallback')) return;
    el.setAttribute('data-img-fallback', '1');
    el.removeAttribute('data-img-pending');
    var b = box(el);
    el.setAttribute('src', fallback(el.getAttribute('data-img-query') || el.getAttribute('alt') || el.getAttribute('src'), b.w, b.h));
  }, true);
  function start(){
    scan();
    new MutationObserver(later).observe(document.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ['data-img-query'] });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>

  <script type="text/babel" data-type="module" data-presets="react">
    // Lucide 아이콘 컴포넌트 헬퍼
    const createLucideIcon = (iconName) => {
      return ({ className = '', size = 24, strokeWidth = 2, ...props }) => {
        const ref = React.useRef(null);
        React.useEffect(() => {
          if (ref.current && typeof lucide !== 'undefined' && lucide[iconName]) {
            ref.current.innerHTML = '';
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            const iconNode = lucide.createElement(lucide[iconName]);
            svg.innerHTML = iconNode.innerHTML;
            Array.from(iconNode.attributes).forEach(attr => {
              svg.setAttribute(attr.name, attr.value);
            });
            if (className) svg.setAttribute('class', className);
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
            svg.setAttribute('stroke-width', strokeWidth);
            ref.current.appendChild(svg);
          }
        }, [className, size, strokeWidth]);
        return React.createElement('span', {
          ref,
          style: { display: 'inline-flex', alignItems: 'center', justifyContent: 'center' },
          ...props
        });
      };
    };
    const Grid = createLucideIcon('Grid');
    const Info = createLucideIcon('Info');
    const Calendar = createLucideIcon('Calendar');
    const Sun = createLucideIcon('Sun');
    const Cloud = createLucideIcon('Cloud');
    const Moon = createLucideIcon('Moon');
    const ChevronRight = createLucideIcon('ChevronRight');
    const ArrowRight = createLucideIcon('ArrowRight');
    const AlertCircle = createLucideIcon('AlertCircle');
    const Database = createLucideIcon('Database');

    

    const { useState, useEffect } = React;
    const STORAGE_KEY = 'school-meals-demo-v1';
    const numberFormatter = new Intl.NumberFormat('ko-KR');
    const dateFormatter = new Intl.DateTimeFormat('ko-KR', {
      year: 'numeric',
      month: 'long',
      day: 'numeric',
      weekday: 'long'
    });

    const mealTypes = [
      { value: 'breakfast', label: '조식', Icon: Sun },
      { value: 'lunch', label: '중식', Icon: Cloud },
      { value: 'dinner', label: '석식', Icon: Moon }
    ];

    function localDate(date = new Date()) {
      return [
        String(date.getFullYear()).padStart(4, '0'),
        String(date.getMonth() + 1).padStart(2, '0'),
        String(date.getDate()).padStart(2, '0')
      ].join('-');
    }

    function parseDate(value) {
      if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) {
        return null;
      }
      const [year, month, day] = value.split('-').map(Number);
      const date = new Date(2000, month - 1, day, 12);
      date.setFullYear(year);
      return localDate(date) === value ? date : null;
    }

    function shiftDate(value, amount) {
      const date = parseDate(value);
      if (!date) return localDate();
      date.setDate(date.getDate() + amount);
      const result = localDate(date);
      return /^\d{4}-\d{2}-\d{2}$/.test(result) ? result : value;
    }

    function createSamples() {
      const today = localDate();
      const now = new Date().toISOString();
      const examples = [
        [today, 'breakfast', '소고기 야채죽',
          ['메추리알 장조림', '오이무침', '배추김치'], 3500,
          '쇠고기, 달걀, 대두, 밀 함유'],
        [today, 'lunch', '제육볶음 한 상',
          ['잡곡밥', '미역국', '콩나물무침', '배추김치'], 5500,
          '돼지고기, 대두, 밀 함유'],
        [today, 'dinner', '닭갈비 덮밥',
          ['팽이버섯 된장국', '양배추 샐러드', '깍두기'], 5000,
          '닭고기, 대두, 밀 함유'],
        [shiftDate(today, 1), 'lunch', '돈가스 정식',
          ['쌀밥', '유부 장국', '양배추 샐러드', '단무지'], 5800,
          '돼지고기, 달걀, 우유, 밀, 대두 함유']
      ];

      return examples.map(([date, mealType, title, items, price, allergyInfo], index) => ({
        id: `sample-${date}-${mealType}-${index}`,
        date,
        mealType,
        title,
        items,
        price,
        allergyInfo,
        createdAt: now,
        updatedAt: now
      }));
    }

    function isValidData(value) {
      if (!Array.isArray(value)) return false;
      const ids = new Set();
      const slots = new Set();

      return value.every(meal => {
        if (!meal || typeof meal !== 'object') return false;
        const slot = `${meal.date}-${meal.mealType}`;
        const valid =
          typeof meal.id === 'string' && meal.id.trim().length > 0 &&
          !!parseDate(meal.date) &&
          mealTypes.some(type => type.value === meal.mealType) &&
          typeof meal.title === 'string' &&
          meal.title.trim().length >= 1 &&
          meal.title.trim().length <= 100 &&
          Array.isArray(meal.items) && meal.items.length > 0 &&
          meal.items.every(item => typeof item === 'string' && item.trim()) &&
          Number.isSafeInteger(meal.price) && meal.price >= 0 &&
          (meal.allergyInfo === undefined || typeof meal.allergyInfo === 'string') &&
          typeof meal.createdAt === 'string' &&
          Number.isFinite(Date.parse(meal.createdAt)) &&
          typeof meal.updatedAt === 'string' &&
          Number.isFinite(Date.parse(meal.updatedAt)) &&
          !ids.has(meal.id) && !slots.has(slot);

        ids.add(meal.id);
        slots.add(slot);
        return valid;
      });
    }

    function readMeals(initialize = false) {
      let raw;
      try {
        raw = localStorage.getItem(STORAGE_KEY);
      } catch {
        return {
          meals: [],
          warning: 'ブラウザ'
            .replace('ブラウザ', '브라우저 저장소에 접근할 수 없습니다. 사이트 데이터 저장 설정을 확인해 주세요.')
        };
      }

      if (raw === null) {
        if (!initialize) return { meals: [], warning: '' };
        const samples = createSamples();
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(samples));
          return { meals: samples, warning: '' };
        } catch {
          return {
            meals: samples,
            warning: '브라우저 저장에 실패했습니다. 현재 샘플은 임시로 표시되며, 새로고침 후 유지되지 않을 수 있습니다.'
          };
        }
      }

      try {
        const meals = JSON.parse(raw);
        if (!isValidData(meals)) throw new Error('invalid-data');
        return { meals, warning: '' };
      } catch {
        return {
          meals: [],
          warning: '저장된 식단 데이터를 읽을 수 없습니다. 원본 데이터는 변경하지 않았습니다. 메뉴 관리에서 데이터를 확인하거나 데모 데이터 초기화를 진행해 주세요.'
        };
      }
    }

    function Header() {
      return (
        <header className="sticky top-0 z-50 border-b border-line bg-white">
          <div className="border-b border-line bg-surface">
            <div className="mx-auto flex max-w-[1200px] items-start justify-center gap-2 px-5 py-2.5 text-center text-xs text-body">
              <Info className="mt-0.5 h-3.5 w-3.5 shrink-0" aria-hidden="true" />
              <p>체험용 서비스입니다. 데이터는 현재 브라우저에만 저장됩니다.</p>
            </div>
          </div>

          <div className="mx-auto flex max-w-[1200px] flex-col gap-4 px-5 py-4 sm:flex-row sm:items-center sm:justify-between lg:px-8">
            {/* 로고와 서비스명을 누르면 메인 페이지로 이동합니다. */}
            <a
              href="./index.html"
              aria-label="오늘의 학식 메인 페이지로 이동"
              className="flex min-w-0 items-center gap-3 self-start rounded-xl hover:opacity-80"
            >
              <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-[13px] bg-brand text-white">
                <Grid className="h-5 w-5" aria-hidden="true" />
              </div>
              <div>
                <p className="text-lg font-bold tracking-tight text-ink">오늘의 학식</p>
                <p className="text-xs text-muted">학교 식당 메뉴 안내</p>
              </div>
            </a>

            <nav
              aria-label="주요 메뉴"
              className="grid w-full grid-cols-2 gap-1 rounded-[14px] bg-surface p-1 sm:w-auto sm:min-w-[240px]"
            >
              <a
                href="./student.html"
                aria-current="page"
                className="flex min-h-[44px] items-center justify-center rounded-[10px] bg-white px-5 py-2 text-sm font-semibold text-brand shadow-soft hover:bg-blue-50"
              >
                학생 보기
              </a>
              <a
                href="./menumanage.html"
                className="flex min-h-[44px] items-center justify-center rounded-[10px] px-5 py-2 text-sm font-medium text-body hover:bg-white hover:text-brand"
              >
                메뉴 관리
              </a>
            </nav>
          </div>
        </header>
      );
    }

    function MealCard({ type, meal }) {
      const { label, Icon } = type;

      return (
        <article
          aria-label={`${label} 식단`}
          className="flex min-w-0 flex-col rounded-[24px] border border-line bg-white p-6 shadow-soft"
        >
          <div className="mb-6 flex items-center gap-3">
            <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-surface">
              <Icon className="h-5 w-5 text-body" aria-hidden="true" />
            </div>
            <h3 className="text-base font-semibold text-ink">{label}</h3>
          </div>

          {meal ? (
            <>
              <p className="break-keep text-xl font-bold tracking-tight text-ink">
                {meal.title}
              </p>
              <ul className="mt-4 space-y-2 text-sm text-body">
                {meal.items.map((item, index) => (
                  <li key={index} className="flex items-start gap-2">
                    <span className="mt-2 h-1 w-1 shrink-0 rounded-full bg-muted" aria-hidden="true" />
                    <span>{item}</span>
                  </li>
                ))}
              </ul>
              <div className="mt-auto pt-7">
                <p className="text-lg font-semibold tabular-nums text-ink">
                  {meal.price === 0 ? '무료' : `${numberFormatter.format(meal.price)}원`}
                </p>
                <div className="mt-4 border-t border-line pt-4">
                  <p className="text-xs font-semibold text-body">알레르기 안내</p>
                  <p className="mt-1 text-xs leading-relaxed text-muted">
                    {meal.allergyInfo?.trim() || '알레르기 정보 미등록'}
                  </p>
                </div>
              </div>
            </>
          ) : (
            <div className="flex flex-1 items-center rounded-2xl bg-surface px-4 py-9">
              <p className="text-sm text-muted">아직 등록된 식단이 없습니다.</p>
            </div>
          )}
        </article>
      );
    }

    function App() {
      const [data, setData] = useState(() => readMeals(true));
      const [selectedDate, setSelectedDate] = useState(() => localDate());
      const [dateError, setDateError] = useState('');

      useEffect(() => {
        const refresh = () => setData(readMeals());
        const onStorage = event => {
          if (event.key === STORAGE_KEY || event.key === null) refresh();
        };
        const onVisibility = () => {
          if (document.visibilityState === 'visible') refresh();
        };

        window.addEventListener('storage', onStorage);
        window.addEventListener('focus', refresh);
        window.addEventListener('pageshow', refresh);
        document.addEventListener('visibilitychange', onVisibility);

        return () => {
          window.removeEventListener('storage', onStorage);
          window.removeEventListener('focus', refresh);
          window.removeEventListener('pageshow', refresh);
          document.removeEventListener('visibilitychange', onVisibility);
        };
      }, []);

      function changeDate(value) {
        if (!parseDate(value)) {
          setDateError('유효한 날짜를 선택해 주세요.');
          return;
        }
        setSelectedDate(value);
        setDateError('');
      }

      const dayMeals = data.meals.filter(meal => meal.date === selectedDate);

      return (
        <div>
          <a
            href="#main-content"
            className="sr-only z-[60] rounded-xl bg-white px-5 py-3 text-brand shadow-soft focus:not-sr-only focus:fixed focus:left-4 focus:top-4"
          >
            본문으로 바로가기
          </a>

          <Header />

          <main id="main-content" className="mx-auto w-full max-w-[1200px] px-5 lg:px-8">
            <section className="pb-8 pt-10 md:pt-14">
              <p className="mb-3 text-sm font-semibold text-brand">매일 만나는 든든함</p>
              <h1 className="text-3xl font-bold tracking-tight text-ink md:text-4xl">
                오늘의 식단을 확인하세요.
              </h1>
              <p className="mt-3 text-sm leading-relaxed text-muted md:text-base">
                원하는 날짜의 조식·중식·석식과 메뉴 구성, 가격을 한눈에 확인하세요.
              </p>
            </section>

            {data.warning && (
              <div role="alert" className="mb-6 flex items-start gap-3 rounded-2xl border border-amber-200 bg-amber-50 p-5 text-sm text-amber-900">
                <AlertCircle className="mt-0.5 h-5 w-5 shrink-0" aria-hidden="true" />
                <div>
                  <p>{data.warning}</p>
                  <a
                    href="./menumanage.html"
                    className="mt-2 inline-block rounded font-semibold underline underline-offset-4 hover:text-amber-950"
                  >
                    메뉴 관리로 이동
                  </a>
                </div>
              </div>
            )}

            <section aria-labelledby="date-title" className="rounded-[24px] bg-surface p-5 md:p-6">
              <div className="flex flex-col gap-5 md:flex-row md:items-end md:justify-between">
                <div className="min-w-0">
                  <label
                    id="date-title"
                    htmlFor="meal-date"
                    className="mb-2 block text-sm font-semibold text-ink"
                  >
                    조회 날짜
                  </label>
                  <div className="flex items-center gap-3">
                    <Calendar className="h-5 w-5 shrink-0 text-brand" aria-hidden="true" />
                    <input
                      id="meal-date"
                      name="date"
                      type="date"
                      min="0001-01-01"
                      max="9999-12-31"
                      value={selectedDate}
                      onChange={event => changeDate(event.target.value)}
                      aria-invalid={!!dateError}
                      aria-describedby={dateError ? 'date-error' : undefined}
                      className="h-12 w-full rounded-xl border border-line bg-white px-3 text-base text-ink md:w-[210px]"
                    />
                  </div>
                  {dateError && (
                    <p id="date-error" role="alert" className="mt-2 text-sm text-red-700">
                      {dateError}
                    </p>
                  )}
                </div>

                <div className="grid grid-cols-3 gap-2">
                  <button
                    type="button"
                    onClick={() => changeDate(shiftDate(selectedDate, -1))}
                    className="inline-flex min-h-[44px] items-center justify-center gap-1 rounded-xl border border-line bg-white px-4 text-sm hover:bg-gray-100 active:scale-[0.98]"
                  >
                    <ChevronRight className="h-4 w-4 rotate-180" aria-hidden="true" />
                    이전 날
                  </button>
                  <button
                    type="button"
                    onClick={() => changeDate(localDate())}
                    className="min-h-[44px] rounded-xl bg-brand px-5 text-sm font-semibold text-white hover:bg-[#0062C5] active:scale-[0.98]"
                  >
                    오늘
                  </button>
                  <button
                    type="button"
                    onClick={() => changeDate(shiftDate(selectedDate, 1))}
                    className="inline-flex min-h-[44px] items-center justify-center gap-1 rounded-xl border border-line bg-white px-4 text-sm hover:bg-gray-100 active:scale-[0.98]"
                  >
                    다음 날
                    <ChevronRight className="h-4 w-4" aria-hidden="true" />
                  </button>
                </div>
              </div>
            </section>

            <section aria-labelledby="meals-title" className="py-8 md:py-10">
              <div className="mb-5 flex flex-wrap items-center justify-between gap-3">
                <h2 id="meals-title" className="text-lg font-bold tracking-tight text-ink" aria-live="polite">
                  {dateFormatter.format(parseDate(selectedDate))}
                </h2>
                <span className="text-xs text-muted">
                  {selectedDate === localDate() ? '오늘의 식단' : '선택한 날짜의 식단'}
                </span>
              </div>

              <div className="grid gap-4 md:grid-cols-3">
                {mealTypes.map(type => (
                  <MealCard
                    key={type.value}
                    type={type}
                    meal={dayMeals.find(meal => meal.mealType === type.value)}
                  />
                ))}
              </div>
              <p className="mt-4 text-xs leading-relaxed text-muted">
                샘플 식단과 알레르기 정보는 데모 예시입니다. 실제 식사 전 식당의 안내를 확인해 주세요.
              </p>
            </section>

            <aside
              aria-labelledby="storage-title"
              className="mb-12 flex items-start gap-3 rounded-2xl bg-surface p-5 md:p-6"
            >
              <Database className="mt-0.5 h-5 w-5 shrink-0 text-muted" aria-hidden="true" />
              <div className="min-w-0">
                <h2 id="storage-title" className="text-sm font-semibold text-ink">
                  데이터는 이 브라우저에만 저장됩니다.
                </h2>
                <p className="mt-2 text-sm leading-relaxed text-muted">
                  같은 주소에서 이용하는 학생 보기와 메뉴 관리는 저장된 식단을 함께 사용합니다.
                  다른 브라우저나 기기와는 공유되지 않으며, 사이트 데이터를 삭제하면
                  식단도 삭제될 수 있습니다. 메뉴 관리는 관리자 인증이나 접근 제한이 없는 체험용 화면입니다.
                </p>
                <a
                  href="./menumanage.html"
                  className="mt-3 inline-flex min-h-[32px] items-center gap-2 rounded text-sm font-medium text-brand hover:text-[#0062C5]"
                >
                  메뉴 관리로 이동
                  <ArrowRight className="h-4 w-4" aria-hidden="true" />
                </a>
              </div>
            </aside>
          </main>

          <footer className="border-t border-line">
            <div className="mx-auto flex max-w-[1200px] flex-col justify-between gap-4 px-5 py-6 sm:flex-row sm:items-center lg:px-8">
              <div>
                <a
                  href="./index.html"
                  className="rounded text-sm font-semibold text-ink hover:text-brand"
                >
                  오늘의 학식
                </a>
                <p className="mt-1 text-xs text-muted">
                  하루 세 끼, 학교 식당 메뉴를 한눈에.
                </p>
              </div>
              <p className="text-xs text-muted">
                샘플 식단과 알레르기 정보는 데모 예시입니다.
              </p>
            </div>
          </footer>
        </div>
      );
    }

    window.ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
